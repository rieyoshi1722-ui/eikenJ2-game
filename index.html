<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>準2級マークドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column that behaves like an answer sheet.
   Home = mode list grouped by exam section. Quiz = row of marks, question card, numbered bubble choices.
   Result = score with a 60% pass-line meter. Highlighter yellow is the only accent. */
:root{
  --paper:#ECEFF5; --card:#FFFFFF; --ink:#17203A; --ink-2:#4B587A; --line:#CAD2E2;
  --mark:#FFD84A; --mark-soft:#FFF0A6; --mark-under:#FFD84A; --mark-ink:#17203A;
  --good:#12805A; --good-bg:#DDF3E9; --bad:#C23B33; --bad-bg:#FBE3E0;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-en:"Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1525; --card:#172038; --ink:#EDF0F8; --ink-2:#A5B1CE; --line:#2B3658;
    --mark:#FFD84A; --mark-soft:#4A3F0F; --mark-under:#7A6400; --mark-ink:#17203A;
    --good:#4CD6A0; --good-bg:#12392C; --bad:#FF8279; --bad-bg:#46211F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1525; --card:#172038; --ink:#EDF0F8; --ink-2:#A5B1CE; --line:#2B3658;
  --mark:#FFD84A; --mark-soft:#4A3F0F; --mark-under:#7A6400; --mark-ink:#17203A;
  --good:#4CD6A0; --good-bg:#12392C; --bad:#FF8279; --bad-bg:#46211F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{font-family:var(--f-jp);font-size:18.9px;line-height:1.7;background:var(--paper);color:var(--ink);
  padding-inline:16px;padding-block:20px 28px;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
p{margin:0}

/* home */
.eyebrow{font-size:14.2px;font-weight:700;color:var(--ink-2);letter-spacing:.08em}
h1{margin:6px 0 8px;font-size:clamp(34px,10vw,46px);line-height:1.2;font-weight:900;text-wrap:balance}
.hl{background:linear-gradient(transparent 58%,var(--mark-under) 58%);padding:0 .06em}
.lead{font-size:17.7px;color:var(--ink-2);line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-block:18px 4px;border-block:1.5px solid var(--ink)}
.stat{padding:10px 4px 8px;text-align:center;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-size:30.7px;line-height:1.25;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:14.2px;color:var(--ink-2)}
.grp{margin:24px 0 8px;font-size:15.3px;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%;
  padding:12px 14px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;min-height:64px}
.mode:active{transform:scale(.99)}
.mode-main{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.mode-name{font-size:21.2px;font-weight:900}
.mode-tag{font-size:13px;font-weight:700;padding:0 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2)}
.mode-desc{grid-column:1;font-size:15.3px;color:var(--ink-2);line-height:1.5}
.mode-best{grid-column:2;grid-row:1 / span 2;font-size:14.2px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.mode.strong{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mode.strong .mode-desc,.mode.strong .mode-best,.mode.strong .mode-tag{color:inherit;opacity:.82}
.mode.strong .mode-tag{border-color:currentColor}
.mode:disabled{opacity:.55;cursor:default}
.fine{margin-top:24px;font-size:14.2px;color:var(--ink-2);line-height:1.8}

/* quiz */
#quiz{padding-bottom:96px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.link{background:none;border:0;padding:8px 6px;margin-left:-6px;font-size:16.5px;color:var(--ink-2);font-weight:700}
.score{display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:16.5px}
.combo{background:var(--mark);color:var(--mark-ink);padding:0 10px;border-radius:99px;font-size:14.2px}
.marks{display:flex;gap:4px;margin-bottom:8px}
.mk{flex:1;min-width:0;height:10px;border-radius:3px;background:var(--line);border:1.5px solid transparent}
.mk.cur{background:var(--mark);border-color:var(--ink)}
.mk.ok{background:var(--good)}
.mk.ng{background:var(--bad)}
.tbar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.tfill{height:100%;width:0;background:var(--ink-2)}
.tfill.late{background:var(--bad)}
#qbody{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.kind{align-self:flex-start;font-size:14.2px;font-weight:900;background:var(--mark);color:var(--mark-ink);padding:1px 10px;border-radius:6px}
.prompt{font-size:16.5px;color:var(--ink-2)}
.jp-hint{font-size:22.4px;font-weight:700;line-height:1.55}
.qtext{font-family:var(--f-en),var(--f-jp);font-size:23.6px;line-height:1.6;overflow-wrap:anywhere}
.line{display:flex;gap:8px;align-items:baseline}
.line+.line{margin-top:6px}
.lt{min-width:0}
.spk{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--f-jp);font-size:14.2px;font-weight:900;display:inline-grid;place-items:center;transform:translateY(-2px)}
.blank{display:inline-block;min-width:4.5em;height:1.1em;vertical-align:-.2em;background:var(--mark-soft);border-bottom:3px solid var(--mark);border-radius:4px 4px 0 0}
.blank.filled{height:auto;min-width:0;background:var(--mark);color:var(--mark-ink);border-bottom-color:var(--ink);padding:0 .3em;font-weight:700;vertical-align:baseline}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;width:100%;
  padding:11px 14px;min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.bub{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center;font-weight:900;font-size:17.7px;font-variant-numeric:tabular-nums}
.ctext{font-family:var(--f-en),var(--f-jp);font-size:21.2px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.choice:active:not(:disabled) .bub{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (hover:hover){.choice:hover:not(:disabled){border-color:var(--ink)}}
.choice:disabled{cursor:default}
.choice.is-ok{border-color:var(--good);background:var(--good-bg)}
.choice.is-ok .bub{background:var(--good);border-color:var(--good);color:var(--paper)}
.choice.is-ng{border-color:var(--bad);background:var(--bad-bg)}
.choice.is-ng .bub{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.choice.dim{opacity:.55}
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)}
.fb.ng{background:var(--bad-bg)}
.fb-h{display:flex;justify-content:space-between;align-items:baseline;font-size:23.6px;font-weight:900}
.fb.ok .fb-h span:first-child{color:var(--good)}
.fb.ng .fb-h span:first-child{color:var(--bad)}
.gain{font-size:16.5px;font-variant-numeric:tabular-nums}
.ans{font-size:17.7px}
.ans b{font-family:var(--f-en),var(--f-jp);font-size:20.1px;overflow-wrap:anywhere}
.ans.mine{color:var(--bad)}
.why{font-size:17.7px;line-height:1.75}
.ja{font-size:16.5px;color:var(--ink-2)}
.ja span{display:inline-block;margin-right:8px;font-weight:900;font-size:13px;border:1px solid currentColor;border-radius:4px;padding:0 5px}
.audio{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.play{display:inline-flex;align-items:center;gap:10px;padding:0 20px;min-height:48px;border-radius:99px;border:0;background:var(--ink);color:var(--paper);font-weight:900;font-size:18.9px}
.pi{font-size:16.5px}
.note{font-size:15.3px;color:var(--ink-2)}
.script{background:var(--paper);border:1px dashed var(--ink-2);border-radius:12px;padding:10px 12px;font-family:var(--f-en),var(--f-jp);font-size:17.7px;line-height:1.6}
.sl+.sl{margin-top:4px}
.sl b{display:inline-block;min-width:1.6em;font-family:var(--f-jp);color:var(--ink-2)}
.slots{min-height:68px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px;border:2px dashed var(--ink-2);border-radius:14px;background:var(--card)}
.slots-empty{color:var(--ink-2);font-size:16.5px;align-self:center}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-en),var(--f-jp);font-size:21.2px;padding:6px 14px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card)}
.chip.in{background:var(--mark-soft);border-color:var(--mark)}
.slots.ok{border-style:solid;border-color:var(--good)}
.slots.ok .chip{background:var(--good-bg);border-color:var(--good)}
.slots.ng{border-style:solid;border-color:var(--bad)}
.slots.ng .chip{background:var(--bad-bg);border-color:var(--bad)}
.order-actions{display:flex;gap:10px}
.order-actions .btn{flex:1}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:50px;padding:0 20px;border-radius:14px;border:2px solid var(--ink);background:transparent;font-weight:900;font-size:18.9px}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.sm{min-height:44px;font-size:16.5px;padding:0 14px;border-width:1.5px}
.btn:disabled{opacity:.4;cursor:default}
.nextbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.nextbar .btn{display:flex;width:100%;max-width:520px;margin:0 auto}

/* result */
.r-score{font-size:89.7px;line-height:1.1;font-weight:900;font-variant-numeric:tabular-nums;margin-top:6px}
.r-score small{font-size:35.4px;color:var(--ink-2)}
.r-msg{font-size:20.1px;font-weight:700;margin-top:4px}
.r-sub{font-size:15.3px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.meter{position:relative;height:14px;border-radius:8px;background:var(--line);margin:22px 0 40px}
.meter-fill{height:100%;border-radius:8px;background:var(--ink-2)}
.meter-fill.pass{background:var(--good)}
.meter-line{position:absolute;left:60%;top:-6px;bottom:-6px;border-left:2px solid var(--ink)}
.meter-lab{position:absolute;left:60%;top:22px;transform:translateX(-50%);font-size:13px;font-weight:700;white-space:nowrap}
.r-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.rw-h{font-size:16.5px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
.rws{display:flex;flex-direction:column;gap:10px}
.rw{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rw-k{font-size:13px;font-weight:700;color:var(--ink-2)}
.rw-q{font-family:var(--f-en),var(--f-jp);font-size:18.9px;line-height:1.5;overflow-wrap:anywhere}
.rw-a{font-size:16.5px}
.rw-a b{font-family:var(--f-en),var(--f-jp);overflow-wrap:anywhere}
.rw-w{font-size:15.3px;color:var(--ink-2);line-height:1.7}
@media (prefers-reduced-motion:no-preference){
  .choice.is-ok .bub{animation:pop .28s ease-out}
  @keyframes pop{50%{transform:scale(1.25)}}
}
</style>

</head>
<body>
<div id="app">
  <section id="home">
    <p class="eyebrow">非公式・オリジナル問題</p>
    <h1><span class="hl">準2級</span>マークドリル</h1>
    <p class="lead">一次試験で6割をとるための練習ゲーム。マークシートのように、番号をタップして答えます。</p>
    <div class="stats">
      <div class="stat"><b id="stTotal">0</b><span>とけた問題</span></div>
      <div class="stat"><b id="stRate">—</b><span>せいかい率</span></div>
      <div class="stat"><b id="stWrong">0</b><span>まちがいノート</span></div>
    </div>
    <div id="modes"></div>
    <p class="fine">このゲームは英検®の公式ではありません。問題はすべてオリジナルです。試験の形は変わることがあるので、くわしくは英検の公式サイトで見てね。リスニングは、スマホの音声読み上げを使います。</p>
  </section>

  <section id="quiz" hidden>
    <div class="qtop">
      <button class="link" id="backBtn" type="button">← やめる</button>
      <div class="score"><span id="pos"></span><span id="pts"></span><span class="combo" id="combo" hidden></span></div>
    </div>
    <div class="marks" id="marks"></div>
    <div class="tbar" id="tbar" hidden><div class="tfill" id="tfill"></div></div>
    <div id="qbody"></div>
  </section>

  <section id="result" hidden></section>
</div>
<div class="nextbar" id="nextbar" hidden><button class="btn pri" id="nextBtn" type="button">つぎへ</button></div>

/* ---------- storage (per-device convenience, safe if unavailable) ---------- */
var store={best:{},total:0,right:0,wrong:[],seen:{}};
var SK="pre2-mark-drill-v1";
function load(){try{var s=JSON.parse(localStorage.getItem(SK)||"null");if(s&&typeof s==="object"){store.best=s.best||{};store.total=s.total||0;store.right=s.right||0;store.wrong=Array.isArray(s.wrong)?s.wrong:[];store.seen=(s.seen&&typeof s.seen==="object")?s.seen:{};}}catch(e){}}
function save(){try{localStorage.setItem(SK,JSON.stringify(store));}catch(e){}}
function record(q,ok){
  store.total++;if(ok)store.right++;
  var k=store.wrong.indexOf(q.id);
  if(ok){if(k>=0)store.wrong.splice(k,1);}
  else if(k<0){store.wrong.push(q.id);if(store.wrong.length>60)store.wrong.shift();}
  save();
}

var tts=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
var voiceCache=null,playToken=0,playing=false;
if(tts){try{speechSynthesis.onvoiceschanged=function(){voiceCache=null;};}catch(e){}}
function pickVoice(){
  if(voiceCache)return voiceCache;
  try{
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang);});
    voiceCache=vs.filter(function(v){return /google|samantha|aria|jenny|zira/i.test(v.name);})[0]||vs[0]||null;
  }catch(e){}
  return voiceCache;
}
function setPlayUI(on){
  playing=on;
  var pi=$("#pi"),pl=$("#pl");
  if(pi)pi.textContent=on?"■":"▶";
  if(pl)pl.textContent=on?"とめる":"音声をきく";
}
function stopAudio(){
  playToken++;
  if(tts){try{speechSynthesis.cancel();}catch(e){}}
  setPlayUI(false);
}

  if(!tts)return;

  var i=0;
  var next=function(){
    if(my!==playToken)return;
    if(i>=lines.length){setPlayUI(false);return;}
    var L=lines[i++];
    var u=new SpeechSynthesisUtterance(L.t);
    u.lang="en-US";u.rate=0.92;u.pitch=L.w==="m"?0.7:(L.w==="f"?1.15:1);
    var v=pickVoice();if(v)u.voice=v;
    u.onend=function(){setTimeout(next,350);};
    u.onerror=function(){if(my===playToken)setPlayUI(false);};
    speechSynthesis.speak(u);
  };
  next();
}

/* ---------- screens ---------- */
function show(id){
  ["home","quiz","result"].forEach(function(s){$("#"+s).hidden=(s!==id);});
  if(id!=="quiz"){$("#nextbar").hidden=true;stopTimer();stopAudio();}
  try{window.scrollTo(0,0);}catch(e){}
}
function renderHome(){
  $("#stTotal").textContent=store.total;
  $("#stRate").textContent=store.total?Math.round(store.right/store.total*100)+"%":"—";
  $("#stWrong").textContent=store.wrong.length;
  var html="",last="";
  MODES.forEach(function(m){
    if(m.g!==last){html+=(last?"</div>":"")+'<h2 class="grp">'+esc(m.g)+'</h2><div class="modes">';last=m.g;}
    var pool=m.pool(),n=Math.min(m.n,pool.length),dis=!pool.length;
    var b=store.best[m.id];
    var badge=dis?"":(b?"ベスト "+b.r+"/"+b.n:"はじめて");
    var desc=dis?"まちがえた問題が、ここにたまります":m.desc+"（"+(pool.length>n?pool.length+"問から"+n+"問":n+"問")+"）";
    html+='<button class="mode'+(m.strong?" strong":"")+'" type="button" data-mode="'+m.id+'"'+(dis?" disabled":"")+'>'
      +'<span class="mode-main"><span class="mode-name">'+esc(m.name)+'</span><span class="mode-tag">'+esc(m.tag)+'</span></span>'
      +'<span class="mode-desc">'+esc(desc)+'</span><span class="mode-best">'+badge+'</span></button>';
  });
  html+="</div>";
  $("#modes").innerHTML=html;
}

/* ---------- session ---------- */
var S=null,tmr=null;
function pickList(m,pool){
  if(m.nobest)return shuffle(pool.slice()).slice(0,m.n);
  var fresh=pool.filter(function(q){return !store.seen[q.id];});
  var list;
  if(fresh.length>=m.n){
    list=shuffle(fresh).slice(0,m.n);
  }else{
    var used=shuffle(pool.filter(function(q){return store.seen[q.id];}));
    list=shuffle(fresh).concat(used).slice(0,m.n);
    pool.forEach(function(q){delete store.seen[q.id];});
  }
  list.forEach(function(q){store.seen[q.id]=1;});
  save();
  return shuffle(list.slice());
}
function startMode(id){
  var m=MODES.filter(function(x){return x.id===id;})[0];if(!m)return;
  var pool=m.pool();if(!pool.length)return;
  begin(m,pickList(m,pool));
}
function begin(m,list){
  S={mode:m,list:list,i:0,pts:0,combo:0,maxCombo:0,right:0,res:[],answered:false,armed:false,t0:0,cur:null,ch:[],bank:[],slot:[]};
  $("#backBtn").textContent="← やめる";
  show("quiz");renderQ();
}
function fmtQ(q,filled){
  var ans=q.c?q.c[0]:"";
  return q.q.split("\n").map(function(line){
    var m=line.match(/^([AB]):\s*(.*)$/),spk="",t=line;
    if(m){spk='<span class="spk">'+m[1]+'</span>';t=m[2];}
    var e=esc(t).replace(/\(\s*\)/g,filled?'<span class="blank filled">'+esc(ans)+'</span>':'<span class="blank"></span>');
    return '<div class="line">'+spk+'<span class="lt">'+e+'</span></div>';
  }).join("");
}
function scriptHTML(q){
  return q.audio.map(function(L){
    var who=L.w==="f"?"女":(L.w==="m"?"男":"");
    return '<p class="sl"><b>'+who+'</b>'+esc(L.t)+'</p>';
  }).join("");
}
function marksHTML(){
  return S.list.map(function(q,k){
    var r=S.res[k];
    var cls=r?(r.ok?"ok":"ng"):(k===S.i?"cur":"");
    return '<i class="mk '+cls+'"></i>';
  }).join("");
}
function updateTop(){
  $("#pos").textContent=Math.min(S.i+1,S.list.length)+" / "+S.list.length;
  $("#pts").textContent=S.pts+" pt";
  var c=$("#combo");
  if(S.combo>=2){c.hidden=false;c.textContent="れんぞく "+S.combo;}else{c.hidden=true;}
  $("#marks").innerHTML=marksHTML();
}
function stopTimer(){if(tmr){clearInterval(tmr);tmr=null;}}
function startTimer(){
  stopTimer();
  var use=S.mode.timer&&S.cur.type==="mc"&&!S.cur.audio;
  $("#tbar").hidden=!use;
  if(!use)return;
  var bar=$("#tfill");bar.style.width="0%";bar.classList.remove("late");
  tmr=setInterval(function(){
    var p=Math.min(100,(Date.now()-S.t0)/300);
    bar.style.width=p+"%";
    if(p>=100)bar.classList.add("late");
  },100);
}
function renderQ(){
  var q=S.list[S.i];
  S.cur=q;S.answered=false;
  $("#nextbar").hidden=true;
  stopAudio();
  updateTop();
  var h='<div class="qcard"><span class="kind">'+esc(q.kind)+'</span>';
  if(q.prompt)h+='<p class="prompt">'+esc(q.prompt)+'</p>';
  if(q.type==="order")h+='<p class="jp-hint">'+esc(q.jp)+'</p>';
  if(q.q)h+='<div class="qtext" id="qtext">'+fmtQ(q,false)+'</div>';
  if(q.audio){
    if(tts){
      h+='<div class="audio"><button class="play" id="playBtn" type="button"><span class="pi" id="pi">▶</span><span id="pl">音声をきく</span></button>'
        +'<button class="btn sm" id="scriptBtn" type="button">台本を見る</button></div>';
    }else{
      h+='<p class="note">この端末では音声が使えないみたい。「台本を見る」で読んで練習しよう。</p>'
        +'<div><button class="btn sm" id="scriptBtn" type="button">台本を見る</button></div>';
    }
    h+='<div class="script" id="scriptBox" hidden>'+scriptHTML(q)+'</div>';
  }
  h+='</div>';
  if(q.type==="mc"){
    S.ch=shuffle(q.c.map(function(t,i){return {t:t,ok:i===0};}));
    h+='<div class="choices" role="group" aria-label="こたえ">'+S.ch.map(function(c,i){
      return '<button class="choice" type="button" data-i="'+i+'"><span class="bub">'+(i+1)+'</span><span class="ctext">'+esc(c.t)+'</span></button>';
    }).join("")+'</div>';
  }else{
    var bank=q.tokens.map(function(t,i){return {i:i,t:t};});
    var tries=0;
    do{shuffle(bank);tries++;}while(tries<10&&bank.map(function(o){return o.t;}).join(" ")===q.tokens.join(" "));
    S.bank=bank;S.slot=[];
    h+='<div class="slots" id="slots" aria-label="こたえ"></div><div class="bank" id="bank"></div>'
      +'<div class="order-actions"><button class="btn" id="clrBtn" type="button">やり直す</button><button class="btn pri" id="chkBtn" type="button">チェック</button></div>';
  }
  h+='<div id="fb" role="status" aria-live="polite"></div>';
  $("#qbody").innerHTML=h;
  if(q.type==="order")drawOrder();
  S.t0=Date.now();
  startTimer();
}
function drawOrder(){
  $("#slots").innerHTML=S.slot.length?S.slot.map(function(o){return '<button class="chip in" type="button" data-act="back" data-i="'+o.i+'">'+esc(o.t)+'</button>';}).join(""):'<span class="slots-empty">ここにことばをならべよう</span>';
  $("#bank").innerHTML=S.bank.map(function(o){return '<button class="chip" type="button" data-act="take" data-i="'+o.i+'">'+esc(o.t)+'</button>';}).join("");
  $("#chkBtn").disabled=S.bank.length>0;
  $("#clrBtn").disabled=S.slot.length===0;
}
function takeChip(i){
  if(S.answered)return;
  var k=S.bank.findIndex(function(o){return o.i===i;});if(k<0)return;
  S.slot.push(S.bank.splice(k,1)[0]);drawOrder();
}
function backChip(i){
  if(S.answered)return;
  var k=S.slot.findIndex(function(o){return o.i===i;});if(k<0)return;
  S.bank.push(S.slot.splice(k,1)[0]);drawOrder();
}
function checkOrder(){
  if(S.answered||S.bank.length)return;
  var q=S.cur;S.answered=true;stopTimer();
  var got=S.slot.map(function(o){return o.t;}).join(" ");
  var ok=got===q.tokens.join(" ")||q.alts.indexOf(got)>=0;
  $("#slots").classList.add(ok?"ok":"ng");
  document.querySelector(".order-actions").hidden=true;
  Array.prototype.forEach.call(document.querySelectorAll("#slots .chip"),function(b){b.disabled=true;});
  settle(ok);
}
function choose(i){
  if(S.answered)return;
  var q=S.cur,c=S.ch[i];
  S.answered=true;stopTimer();S.picked=c.t;
  var btns=Array.prototype.slice.call(document.querySelectorAll(".choice"));
  btns.forEach(function(b,k){
    b.disabled=true;
    var bub=b.querySelector(".bub");
    if(S.ch[k].ok){b.classList.add("is-ok");bub.textContent="✓";}
    else if(k===i){b.classList.add("is-ng");bub.textContent="✕";}
    else{b.classList.add("dim");}
  });
  if(q.fill)$("#qtext").innerHTML=fmtQ(q,true);
  settle(c.ok);
}
function settle(ok){
  var pick=(S.cur.type==="mc")?S.picked:null;
  var q=S.cur,secs=(Date.now()-S.t0)/1000,gain=0;
  if(ok){
    S.right++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);
    var bonus=0;
    if(!q.audio){
      if(q.type==="order")bonus=secs<=30?30:(secs<=60?15:0);
      else bonus=secs<=10?30:(secs<=20?15:0);
    }
    gain=100+Math.min(S.combo-1,5)*20+bonus;
    S.pts+=gain;
  }else{S.combo=0;}
  S.res.push({q:q,ok:ok,pick:pick});
  record(q,ok);
  updateTop();
  if(q.audio){var sb=$("#scriptBox");if(sb)sb.hidden=false;var sbt=$("#scriptBtn");if(sbt)sbt.hidden=true;stopAudio();}
  var ans=q.type==="order"?q.tokens.join(" ")+q.end:q.c[0];
  var h='<div class="fb '+(ok?"ok":"ng")+'"><p class="fb-h"><span>'+(ok?"せいかい！":"おしい！")+'</span>'+(ok?'<span class="gain">+'+gain+' pt</span>':"")+'</p>';
  function withMean(t){var g=(q.type==="mc")?gloss(q,t):"";return '<b>'+esc(t)+'</b>'+(g?' ＝ '+esc(g):'');}
  if(!ok&&pick)h+='<p class="ans mine">あなたのこたえ　'+withMean(pick)+'</p>';
  if(!ok)h+='<p class="ans">せいかいは　'+(q.type==="mc"?withMean(ans):'<b>'+esc(ans)+'</b>')+'</p>';
  else if(q.type==="mc"&&gloss(q,ans))h+='<p class="ans">'+withMean(ans)+'</p>';
  h+='<p class="why">'+esc(q.why)+'</p>';
  if(q.ja)h+='<p class="ja"><span>やく</span>'+esc(q.ja)+'</p>';
  h+='</div>';
  $("#fb").innerHTML=h;
  $("#nextBtn").textContent=(S.i===S.list.length-1)?"けっかを見る":"つぎへ";
  $("#nextbar").hidden=false;
  setTimeout(function(){try{$("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});}catch(e){}},60);
}
function next(){
  if(!S||!S.answered)return;
  S.i++;
  if(S.i>=S.list.length)showResult();else renderQ();
}

/* ---------- result ---------- */
function plain(q){
  if(q.type==="order")return q.jp;
  if(q.audio&&q.q)return q.q;
  if(q.audio)return q.audio.map(function(L){return L.t;}).join(" / ");
  return q.q.replace(/\n/g," / ").replace(/\(\s*\)/,"["+q.c[0]+"]");
}
function showResult(){
  stopTimer();
  var n=S.list.length,r=S.right,pct=Math.round(r/n*100);
  if(!S.mode.nobest){
    var b=store.best[S.mode.id];
    if(!b||r/n>b.r/b.n)store.best[S.mode.id]={r:r,n:n};
    save();
  }
  var msg=pct>=90?"かんぺき！本番でもこの調子でいこう。":(pct>=60?"合格ラインのめやす（6割）をこえたよ！":"あと少し！かいせつを読んで、もう1回やってみよう。");
  var wr=S.res.filter(function(x){return !x.ok;});
  var h='<p class="eyebrow">'+esc(S.mode.name)+'のけっか</p>'
    +'<div class="r-score">'+r+'<small> / '+n+'</small></div>'
    +'<p class="r-msg">'+msg+'</p>'
    +'<p class="r-sub">ごうけい '+S.pts+' pt ・ さいだい れんぞく '+S.maxCombo+'</p>'
    +'<div class="meter" role="img" aria-label="せいかい率 '+pct+'パーセント"><div class="meter-fill'+(pct>=60?" pass":"")+'" style="width:'+pct+'%"></div><div class="meter-line"></div><div class="meter-lab">合格ラインのめやす 6割</div></div>'
    +'<div class="r-actions"><button class="btn pri" id="againBtn" type="button">もう1回</button>'
    +(wr.length?'<button class="btn" id="retryBtn" type="button">まちがえた'+wr.length+'問だけやり直す</button>':"")
    +'<button class="btn" id="homeBtn" type="button">ホームにもどる</button></div>';
  if(wr.length){
    h+='<p class="rw-h">まちがえた問題</p><div class="rws">'+wr.map(function(x){
      var q=x.q,ans=q.type==="order"?q.tokens.join(" ")+q.end:q.c[0];
      return '<div class="rw"><span class="rw-k">'+esc(q.kind)+'</span><p class="rw-q">'+esc(plain(q))+'</p>'
        +(x.pick?'<p class="rw-a">あなた：<b>'+esc(x.pick)+'</b>'+(gloss(q,x.pick)?' ＝ '+esc(gloss(q,x.pick)):'')+'</p>':'')+'<p class="rw-a">せいかい：<b>'+esc(ans)+'</b>'+(q.type==="mc"&&gloss(q,ans)?' ＝ '+esc(gloss(q,ans)):'')+'</p><p class="rw-w">'+esc(q.why)+'</p></div>';
    }).join("")+'</div>';
  }
  $("#result").innerHTML=h;
  show("result");
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("mode")){startMode(t.dataset.mode);return;}
  if(t.classList.contains("choice")){choose(+t.dataset.i);return;}
  if(t.dataset.act==="take"){takeChip(+t.dataset.i);return;}
  if(t.dataset.act==="back"){backChip(+t.dataset.i);return;}
  switch(t.id){
    case "chkBtn":checkOrder();break;
    case "clrBtn":if(!S.answered){S.bank=S.bank.concat(S.slot);S.slot=[];drawOrder();}break;
    case "nextBtn":next();break;
    case "playBtn":if(playing)stopAudio();else playLines(S.cur.audio);break;
    case "scriptBtn":var sb=$("#scriptBox");if(sb){sb.hidden=!sb.hidden;t.textContent=sb.hidden?"台本を見る":"台本をとじる";}break;
    case "backBtn":
      if(S.armed){S=null;renderHome();show("home");}
      else{S.armed=true;t.textContent="もう一度おすと終了";setTimeout(function(){if(S){S.armed=false;t.textContent="← やめる";}},3000);}
      break;
    case "againBtn":startMode(S.mode.id);break;
    case "retryBtn":
      var list=S.res.filter(function(x){return !x.ok;}).map(function(x){return x.q;});
      begin({id:"retry",name:"やり直し",timer:S.mode.timer,nobest:true},shuffle(list));
      break;
    case "homeBtn":renderHome();show("home");break;
  }
});

load();renderHome();show("home");
})();
</script>
